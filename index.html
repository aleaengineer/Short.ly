<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Meta Tags -->
    <meta name="description" content="Short.ly - Free URL shortener to create perfect, memorable short links for your business or personal use. Track clicks and analytics.">
    <meta name="keywords" content="URL shortener, link shortener, short links, URL redirect, link tracking, QR code generator">
    <meta name="author" content="Farhan Maulana Syidiq">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph Meta Tags for social sharing -->
    <meta property="og:title" content="Short.ly | URL Shortener">
    <meta property="og:description" content="Create short, memorable links and track their performance with Short.ly">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aleaengineer.github.io/Short.ly/">
    <meta property="og:image" content="https://aleaengineer.github.io/Short.ly/images/shortly-og-image.png">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Short.ly | URL Shortener">
    <meta name="twitter:description" content="Create short, memorable links and track their performance">
    <meta name="twitter:image" content="https://aleaengineer.github.io/Short.ly/images/shortly-og-image.png">
    
    <!-- Canonical URL to prevent duplicate content issues -->
    <link rel="canonical" href="https://aleaengineer.github.io/Short.ly/">
    <title>Short.ly | URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
</head>
<body>
    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-primary">
                <i class="fas fa-link me-2"></i>Short.ly
            </h1>
            <p class="lead text-muted">Create short, memorable links and track their performance</p>
        </header>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <div id="url-form">
                            <div class="input-group mb-3">
                                <span class="input-group-text bg-primary text-white">
                                    <i class="fas fa-link"></i>
                                </span>
                                <input type="url" id="original-url" class="form-control form-control-lg" 
                                       placeholder="Paste your long URL here" required>
                                <button id="shorten-btn" class="btn btn-primary btn-lg px-4">
                                    <i class="fas fa-rocket me-2"></i>Shorten
                                </button>
                            </div>
                            <div class="form-text text-end">
                                <span id="char-count">0</span>/200 characters
                            </div>
                        </div>

                        <div id="result-section" class="text-center mt-4" style="display: none;">
                            <div class="alert alert-success d-flex align-items-center">
                                <i class="fas fa-check-circle me-3 fs-4"></i>
                                <div>Your short URL has been created successfully!</div>
                            </div>

                            <div class="input-group mb-3">
                                <input type="text" id="short-url" class="form-control form-control-lg" readonly>
                                <button id="copy-btn" class="btn btn-outline-secondary">
                                    <i class="far fa-copy"></i> Copy
                                </button>
                                <a id="test-btn" href="#" class="btn btn-primary">
                                    <i class="fas fa-external-link-alt"></i> Test
                                </a>
                            </div>

                            <div class="row mt-4">
                                <div class="col-md-6 mb-3">
                                    <div class="card h-100">
                                        <div class="card-body">
                                            <h5><i class="fas fa-qrcode me-2"></i>QR Code</h5>
                                            <div id="qr-code" class="my-3"></div>
                                            <button id="download-qr" class="btn btn-sm btn-outline-primary">
                                                <i class="fas fa-download me-2"></i>Download
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <div class="card h-100">
                                        <div class="card-body">
                                            <h5><i class="fas fa-chart-bar me-2"></i>Stats</h5>
                                            <div class="stats-container">
                                                <div class="stat-item">
                                                    <span class="stat-value" id="click-count">0</span>
                                                    <span class="stat-label">Total Clicks</span>
                                                </div>
                                                <div class="stat-item">
                                                    <span class="stat-value" id="created-at">Now</span>
                                                    <span class="stat-label">Created</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button id="new-link-btn" class="btn btn-outline-primary mt-3">
                                <i class="fas fa-plus me-2"></i>Create Another
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="text-center mt-5 text-muted">
            <p>© 2025 Farhan Maulana Syidiq - All rights reserved</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
