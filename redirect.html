<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Meta Tags -->
    <meta name="description" content="Short.ly - Free URL shortener to create perfect, memorable short links for your business or personal use. Track clicks and analytics.">
    <meta name="keywords" content="URL shortener, link shortener, short links, URL redirect, link tracking, QR code generator">
    <meta name="author" content="Farhan Maulana Syidiq">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph Meta Tags for social sharing -->
    <meta property="og:title" content="Short.ly | URL Shortener">
    <meta property="og:description" content="Create short, memorable links and track their performance with Short.ly">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aleaengineer.github.io/Short.ly/">
    <meta property="og:image" content="https://aleaengineer.github.io/Short.ly/images/shortly-og-image.png">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Short.ly | URL Shortener">
    <meta name="twitter:description" content="Create short, memorable links and track their performance">
    <meta name="twitter:image" content="https://aleaengineer.github.io/Short.ly/images/shortly-og-image.png">
    
    <!-- Canonical URL to prevent duplicate content issues -->
    <link rel="canonical" href="https://aleaengineer.github.io/Short.ly/">

    <title>Redirecting | Short.ly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/redirect.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-card">
            <div class="brand-logo">
                <i class="fas fa-link"></i>
                <span>Short.ly</span>
            </div>

            <div class="redirect-content">
                <div class="loader">
                    <div class="spinner"></div>
                    <div class="pulse"></div>
                </div>

                <h1>Hold on, we're taking you there</h1>

                <div class="countdown-container">
                    <div class="countdown-circle">
                        <span id="countdown">5</span>
                    </div>
                    <div class="countdown-text">seconds remaining</div>
                </div>

                <div class="destination-info">
                    <div class="url-display" id="destination-url">
                        <i class="fas fa-link"></i>
                        <span>Loading destination...</span>
                    </div>
                    <div class="security-badge">
                        <i class="fas fa-lock"></i>
                        <span>Secure Connection</span>
                    </div>
                </div>

                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>

                <div class="action-buttons">
                    <a href="#" id="proceed-btn" class="btn-proceed">
                        <i class="fas fa-external-link-alt"></i>
                        Proceed Now
                    </a>
                    <a href="/" id="cancel-btn" class="btn-cancel">
                        <i class="fas fa-times"></i>
                        Cancel
                    </a>
                </div>
            </div>

            <div class="security-notice">
                <i class="fas fa-shield-alt"></i>
                <p>You're leaving Short.ly. Always check the URL before entering sensitive information.</p>
            </div>
        </div>
    </div>

    <script src="js/redirect.js"></script>
</body>
</html>
